<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<title>크루즈클럽 AI 도우미</title>
<style>
  :root {
    --navy: #1B3A5C;
    --navy-deep: #122a42;
    --navy-light: #234d78;
    --gold: #D4A94A;
    --gold-light: #e8c26a;
    --ivory: #FAF7F2;
    --ivory-warm: #F2EDE4;
    --text-main: #1B3A5C;
    --text-muted: #6b8099;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--navy);
    overflow: hidden;
  }

  /* Header */
  .header {
    background: var(--navy-deep);
    padding: 14px 20px 14px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(212,169,74,0.2);
    flex-shrink: 0;
  }

  .header-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .header-text p {
    font-size: 11px;
    color: var(--gold);
    margin-top: 1px;
    letter-spacing: 0.2px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 6px #4ade80;
    flex-shrink: 0;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: auto;
  }

  .header-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(212,169,74,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.18s, border-color 0.18s;
    flex-shrink: 0;
  }

  .header-btn:hover, .header-btn:active {
    background: rgba(212,169,74,0.18);
    border-color: rgba(212,169,74,0.5);
  }

  .header-btn svg {
    width: 17px;
    height: 17px;
    fill: rgba(255,255,255,0.8);
  }

  /* Main layout */
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: linear-gradient(180deg, var(--navy) 0%, #1a3855 100%);
    -webkit-overflow-scrolling: touch;
  }

  .chat-area::-webkit-scrollbar { display: none; }

  /* Welcome card */
  .welcome-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(212,169,74,0.25);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }

  .welcome-card .emoji { font-size: 32px; margin-bottom: 10px; display: block; }

  .welcome-card h2 {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .welcome-card p {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
    word-break: keep-all;
  }

  /* Quick questions */
  .quick-title {
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 0 2px;
  }

  .quick-chips {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chip {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(212,169,74,0.2);
    border-radius: 50px;
    padding: 11px 18px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    word-break: keep-all;
    min-height: 50px;
    display: flex;
    align-items: center;
  }

  .chip:hover, .chip:active {
    background: rgba(212,169,74,0.15);
    border-color: rgba(212,169,74,0.5);
    color: #fff;
  }

  /* Messages */
  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .msg-row.user .avatar {
    background: rgba(255,255,255,0.15);
  }

  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.65;
    word-break: keep-all;
  }

  .msg-row.bot .bubble {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.92);
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--gold), #c49238);
    color: #fff;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 18px;
  }

  .dot {
    width: 7px;
    height: 7px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-6px); background: var(--gold); }
  }

  /* Input area */
  .input-area {
    background: var(--navy-deep);
    border-top: 1px solid rgba(212,169,74,0.15);
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(212,169,74,0.2);
    border-radius: 24px;
    padding: 11px 18px;
    transition: border-color 0.2s;
    min-height: 50px;
    display: flex;
    align-items: center;
  }

  .input-wrap:focus-within {
    border-color: rgba(212,169,74,0.6);
  }

  textarea {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    resize: none;
    max-height: 100px;
    line-height: 1.5;
  }

  textarea::placeholder { color: rgba(255,255,255,0.35); }

  .send-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #c49238);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, opacity 0.15s;
  }

  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .send-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  /* Markdown-like in bubble */
  .bubble strong { color: var(--gold-light); font-weight: 700; }
  .bubble a { color: var(--gold-light); text-decoration: underline; }

  @media (max-width: 520px) {
    .bubble { font-size: 13.5px; }
  }
  @media (max-width: 320px) {
    .bubble { font-size: 13px; max-width: 88%; }
  }

  /* Error bubble */
  .error-bubble {
    background: rgba(239,68,68,0.15) !important;
    border-color: rgba(239,68,68,0.3) !important;
    color: #fca5a5 !important;
  }
</style>

<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <button class="header-btn" onclick="history.back()" title="뒤로가기">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="header-icon">🛳️</div>
    <div class="header-text">
      <h1>크루즈클럽 AI 도우미</h1>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">

      <span class="emoji">⚓</span>
      <h2>안녕하세요! 무엇이든 물어보세요</h2>
      <p>inCruises 멤버십 관련 궁금한 점을 자유롭게 질문하세요. 출금, 카드 등록, 계정 오류, 신규 가입 절차까지 도와드릴게요.</p>
    </div>

    <div class="quick-title">자주 묻는 질문</div>

    <div class="quick-chips">
      <button class="chip" onclick="sendQuick(this)">💳 자동결제 카드 어떻게 등록하나요?</button>
      <button class="chip" onclick="sendQuick(this)">💰 수익금 출금 방법이 뭔가요?</button>
      <button class="chip" onclick="sendQuick(this)">🔐 로그인이 안 돼요. 어떻게 하나요?</button>
      <button class="chip" onclick="sendQuick(this)">🆕 신규 멤버인데 처음에 뭘 해야 하나요?</button>
      <button class="chip" onclick="sendQuick(this)">📋 멤버십 유지 조건이 뭔가요?</button>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="userInput"
        placeholder="질문을 입력하세요..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `당신은 "크루즈클럽 AI 도우미"입니다. inCruises 크루즈 멤버십 관련 질문에 친절하고 정확하게 답변하세요.
반드시 한국어로 답변하고, 간결하되 필요한 정보는 빠짐없이 안내하세요.
이모지를 적절히 활용해 친근하게 답변하세요.

=== 핵심 지식 ===

【 신규 멤버 3단계 (10분 완료) 】
STEP 1 - 커뮤니티 입장:
  • 크루즈클럽 밴드 입장: https://band.us/n/a5acA8m6v7jc5
  • 여행 공지방(카톡): https://open.kakao.com/o/grjrD4Sh (여행 멤버십 가입자)
  • 파트너 공지방(카톡): https://open.kakao.com/o/gfVzHdeh (파트너 사업자)
  • ⚠️ 실명(활동명)으로 입장, 질문은 추천 리더에게 개별 카톡으로

STEP 2 - 멤버십 유지 규칙:
  • 정시 납부: 결제일로부터 5일 이내 납부 시 2배 리워드 적립 유지
  • 환불 가능 기간: 가입 후 14일 이내만 환불 가능 (이후 불가)
  • 30일 미납 시 비활성화되지만 내가 낸 금액은 사라지지 않음 → 이후 17%씩 차감 사용 가능
  • ⚠️ 현금 환급 불가 / 1기기 1계정 준수 / 스스로 예약 및 계정 관리 필수

STEP 3 - 자동결제 카드 등록:
  • 경로: 로그인 → 지불 → 청구서 → 자동카드 등록
  • ⚠️ 해외결제 가능한 VISA 또는 MASTER 카드만 등록 가능 (국내 전용 카드 불가)

【 수익금 출금 방법 】
방법 ①: 페이퀴커(PayQuicker) - 해외 계좌로 직접 송금
방법 ②: 인페이(InPay) - 플랫폼 로그인 → 이월렛 → 인페이 메뉴에서 신청
  ※ 인페이가 안 열릴 경우 본인인증을 먼저 완료해야 함
  ※ 인페이 신청 영상: https://youtu.be/DH6hJlZq8ns

【 페이퀴커(PayQuicker) 등록 방법 】
STEP 1: 플랫폼 로그인
STEP 2: 이월렛 클릭
STEP 3: 본인인증 완료
STEP 4: 페이퀴커 클릭 후 등록 (영문 주소 필요)
  • 영문주소 검색: https://search.naver.com/search.naver?query=영문+주소+변환
  • 블로그 가이드: https://blog.naver.com/dadabooboo/223670702473

주요 은행 영문 주소:
  • 신한은행: 20, Sejong-daero 9-gil, Jung-gu, Seoul 04513
  • 국민은행: 26, Gukjegeumyung-ro 8-gil, Yeongdeungpo-gu, Seoul 07331
  • 기업은행: 79, Eulji-ro, Jung-gu, Seoul 04541
  • 농협은행: 120, Saemunan-ro, Jung-gu, Seoul 04516

【 로그인 오류 시 】
이메일 문의: support@incruises.com
제목: 로그인 재설정 요청드립니다 (Login Reset Request)
내용에 포함할 것: 이름, 링크받을 메일주소, 신분증 사본, 신분증 들고 찍은 셀카

【 지원 티켓 요청 방법 】
앱 로그인 → 우측 상단 <?> 물음표 → 담당부서 선택 → 제목/메시지 작성 → 티켓 제출
  • 첨부파일은 한 장씩 업로드
  • 한국어 가능
  • 답변은 이메일과 지원요청 두 곳으로 발송

【 함께 여행 모집 】
• 2026년 10월 MSC 지중해 크루즈 (모집중): https://kbellalee4808-star.github.io/rome261016/
• 2026년 12월 일본 오키나와 크루즈 (모집예정)
• 2027년 5월 그리스 크루즈 (모집예정, Virgin Voyages)
• 2027년 6월 알래스카 크루즈 (모집예정, Princess Cruises)

【 유용한 링크 】
• 크루즈 멤버십 소개: https://kbellalee4808-star.github.io/-3.X/
• 크루즈 예약 가이드: https://kbellalee4808-star.github.io/cruisebook-1/
• 가격 비교 계산기: https://kbellalee4808-star.github.io/Join-Cal/
• 허브 홈페이지: https://kbellalee4808-star.github.io/cruiseclub_hub/

위 정보에 없는 내용은 "추천 리더에게 직접 문의하거나 support@incruises.com으로 연락해주세요"라고 안내하세요.`;

let messages = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendQuick(btn) {
  const text = btn.textContent.trim();
  document.getElementById('userInput').value = text;
  sendMessage();
}

function appendMessage(role, text) {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? '🛳️' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(text);

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
  return bubble;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🛳️';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;

  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  // Remove quick chips on first real message
  document.querySelectorAll('.quick-chips, .quick-title').forEach(el => el.remove());

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  appendMessage('user', text);
  messages.push({ role: 'user', content: text });

  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await res.json();
    removeTyping();

    const reply = data.content?.[0]?.text || '죄송해요, 답변을 가져오지 못했어요. 다시 시도해 주세요.';
    messages.push({ role: 'assistant', content: reply });
    appendMessage('bot', reply);

  } catch (err) {
    removeTyping();
    const bubble = appendMessage('bot', '⚠️ 연결 오류가 발생했어요. 잠시 후 다시 시도해 주세요.');
    bubble.classList.add('error-bubble');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
</script>
</body>
</html>
